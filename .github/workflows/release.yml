name: Release

# Releases are marked by pushing an annotated `vMAJOR.MINOR.PATCH` tag to a
# commit that is already on `main`. The tag build verifies that commit, then
# publishes the API and worker runtime images from the same source tree.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  API_IMAGE: ghcr.io/${{ github.repository }}-api
  WORKER_IMAGE: ghcr.io/${{ github.repository }}-worker

jobs:
  guard:
    name: Check release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a semantic version tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag '$tag' is not vMAJOR.MINOR.PATCH[-prerelease]" >&2
            exit 1
          fi
      - name: Require an annotated tag
        run: |
          git fetch --force origin \
            "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [[ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" != "tag" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} must be annotated (git tag --annotate)" >&2
            exit 1
          fi
      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Tag ${GITHUB_REF_NAME} does not point at a reviewed commit on main" >&2
            exit 1
          fi

  verify:
    name: Verify
    needs: guard
    uses: ./.github/workflows/verify.yml

  publish:
    name: Publish images
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      api-digest: ${{ steps.api-push.outputs.digest }}
      worker-digest: ${{ steps.worker-push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is deliberately disabled: deployments pin immutable tags or
      # digests, and API and worker must always come from the same release.
      - id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
      - id: worker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WORKER_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Build and push API image
        id: api-push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api-runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          annotations: ${{ steps.api-meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build and push worker image
        id: worker-push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker-runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.worker-meta.outputs.tags }}
          labels: ${{ steps.worker-meta.outputs.labels }}
          annotations: ${{ steps.worker-meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Attest API image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.API_IMAGE }}
          subject-digest: ${{ steps.api-push.outputs.digest }}
          push-to-registry: true
      - name: Attest worker image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.WORKER_IMAGE }}
          subject-digest: ${{ steps.worker-push.outputs.digest }}
          push-to-registry: true

  release:
    name: Publish release notes
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          API_DIGEST: ${{ needs.publish.outputs.api-digest }}
          WORKER_DIGEST: ${{ needs.publish.outputs.worker-digest }}
        run: |
          if [[ -z "$API_DIGEST" || -z "$WORKER_DIGEST" ]]; then
            echo "Missing published image digest; refusing to announce a release" >&2
            exit 1
          fi
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          cat > release-notes.md <<NOTES
          Pin both images from this release together. Digests are immutable and
          are the recommended pins for \`.env.production\`:

          \`\`\`bash
          RECEIPT_REPORT_API_IMAGE=${API_IMAGE}@${API_DIGEST}
          RECEIPT_REPORT_WORKER_IMAGE=${WORKER_IMAGE}@${WORKER_DIGEST}
          \`\`\`

          Equivalent version tags: \`${API_IMAGE}:${TAG#v}\` and
          \`${WORKER_IMAGE}:${TAG#v}\`.

          Review the upgrade, backup, and rollback procedure in
          \`docs/deployment.md\` before deploying. Never run a newer worker
          against an older API or schema.
          NOTES
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --generate-notes \
            "${prerelease[@]}"
